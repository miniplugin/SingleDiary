apply plugin: 'com.android.application'

android {
    //compileSdkVersion 34 //deprecated
    //buildToolsVersion "34.0.0" //deprecated

    defaultConfig {
        applicationId "org.android.kimilgukdiary"
        compileSdk 36
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 17
        versionName "SDK36"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'org.techtown.diary'
}

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    //implementation 'lib.kingja.switchbutton:switchbutton:1.1.8'
	implementation 'com.github.KingJA:SwitchButton:v1.1.3' //위 jcenter 사용중지 후 대신사용 https://jitpack.io/#KingJA/SwitchButton/v1.1.3
    implementation 'com.github.channguyen:rsv:1.0.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0-alpha'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'com.github.pedroSG94:AutoPermissions:1.0.3'
    //implementation 'com.yanzhenjie:permission:2.0.3'//위 대신 사용
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.google.code.gson:gson:2.8.6'
}